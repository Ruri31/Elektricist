<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer circle (navy, with gap top-left) -->
  <circle cx="60" cy="60" r="52" stroke="#0B1F3A" stroke-width="6"
    stroke-dasharray="295 35" stroke-dashoffset="100" stroke-linecap="round"/>

  <!-- Circuit traces — left side -->
  <line x1="18" y1="60" x2="32" y2="60" stroke="#0B1F3A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="60" r="3.5" stroke="#0B1F3A" stroke-width="2.5" fill="white"/>
  <line x1="32" y1="60" x2="32" y2="44" stroke="#0B1F3A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="44" r="3.5" stroke="#0B1F3A" stroke-width="2.5" fill="white"/>
  <line x1="32" y1="44" x2="45" y2="44" stroke="#0B1F3A" stroke-width="2.5" stroke-linecap="round"/>

  <line x1="18" y1="70" x2="38" y2="70" stroke="#0B1F3A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="38" cy="70" r="3.5" stroke="#0B1F3A" stroke-width="2.5" fill="white"/>

  <line x1="20" y1="80" x2="30" y2="80" stroke="#0B1F3A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="30" cy="80" r="3.5" stroke="#0B1F3A" stroke-width="2.5" fill="white"/>

  <!-- Lightning bolt — yellow, centre -->
  <polygon points="65,18 48,62 59,62 56,102 76,58 65,58" fill="#FACC15"/>

  <!-- WiFi — top right -->
  <path d="M83 42 Q90 35 97 42" stroke="#0F766E" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M79 47 Q90 36 101 47" stroke="#0F766E" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="90" cy="52" r="3.5" fill="#0F766E"/>

  <!-- Network triangle — bottom right -->
  <circle cx="94" cy="74" r="4.5" stroke="#0B1F3A" stroke-width="2.5" fill="white"/>
  <circle cx="106" cy="90" r="4.5" stroke="#0B1F3A" stroke-width="2.5" fill="white"/>
  <circle cx="82" cy="96" r="4.5" stroke="#0B1F3A" stroke-width="2.5" fill="white"/>
  <line x1="94" y1="74" x2="106" y2="90" stroke="#0B1F3A" stroke-width="2.5"/>
  <line x1="106" y1="90" x2="82" y2="96" stroke="#0B1F3A" stroke-width="2.5"/>
  <line x1="82" y1="96" x2="94" y2="74" stroke="#0B1F3A" stroke-width="2.5"/>
</svg>
